version: 1
formatters:
    f_default:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
        datefmt: '%Y/%m/%d %H:%M:%S'

handlers:
    h_console:
        class: logging.StreamHandler
        formatter: f_default
        level: INFO
        stream: ext://sys.stdout
    h_rotfile:
        class : logging.handlers.RotatingFileHandler
        formatter: f_default
        level: INFO
        #Note this filename is only the fallback. When launched normally each session creates its own timestamped log file (session_YYYYMMDD_HHMMSS.log)
        filename: ../logs/main.log
        maxBytes: 0
        backupCount: 0

loggers:
    l_default:
        level: INFO
        handlers:
          - h_console
          - h_rotfile
        propagate: False

root:
    level: INFO
    handlers:
      - h_console
      - h_rotfile
